plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def platformApiJar = providers.gradleProperty('platformApiJar').orNull

android {
    compileSdk 33
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "me.phh.ims"
        minSdk 32
        targetSdk 33
        versionCode 33
        versionName "1.0"
    }

    sourceSets {
        main {
            jniLibs {
                srcDirs += "${projectDir}/jniLibs"
            }
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    externalNativeBuild {
        cmake {
            path file('jni/CMakeLists.txt')
        }
    }
    namespace 'me.phh.ims'
}

dependencies {
    if (platformApiJar != null) {
        compileOnly files(platformApiJar, 'libs/ImsMediaFramework.jar')
    } else {
        compileOnly fileTree(dir: 'libs', include: '*.jar')
    }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}

// 🌟 [핵심 수정] Kotlin 및 Java 컴파일러 내부의 클래스패스 최우선순위 강제 조정 스크립트
allprojects {
    tasks.all { task ->
        // Java 컴파일러 가로채기
        if (task instanceof JavaCompile) {
            task.doFirst {
                def customJar = files("${projectDir}/libs/ImsMediaFramework.jar")
                task.options.bootstrapClasspath = customJar + (task.options.bootstrapClasspath ?: files())
                task.classpath = customJar + task.classpath
            }
        }
        // Kotlin 컴파일러 가로채기 (클래스 속성을 직접 리스트 결합으로 우회)
        if (task.class.name.contains("KotlinCompile")) {
            task.doFirst {
                def customJar = files("${projectDir}/libs/ImsMediaFramework.jar")
                if (task.hasProperty('libraries')) {
                    task.libraries.setFrom(customJar, task.libraries)
                } else if (task.hasProperty('classpath')) {
                    task.classpath = customJar + task.classpath
                }
            }
        }
    }
}
