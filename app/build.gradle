plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def platformApiJar = providers.gradleProperty('platformApiJar').orNull

android {
    compileSdk 33
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "me.phh.ims"
        minSdk 32
        targetSdk 33
        versionCode 33
        versionName "1.0"
    }

    sourceSets {
        main {
            jniLibs {
                srcDirs += "${projectDir}/jniLibs"
            }
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        // 🌟 [핵심 변경] Kotlin 컴파일러가 시스템 API 파일을 최우선하도록 Xbootclasspath 바인딩 추가
        freeCompilerArgs += [
            "-Xbootclasspath=${projectDir}/libs/ImsMediaFramework.jar"
        ]
    }
    externalNativeBuild {
        cmake {
            path file('jni/CMakeLists.txt')
        }
    }
    namespace 'me.phh.ims'
}

dependencies {
    if (platformApiJar != null) {
        compileOnly files(platformApiJar, 'libs/ImsMediaFramework.jar')
    } else {
        compileOnly fileTree(dir: 'libs', include: '*.jar')
    }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}

// 🌟 [추가] Java 컴파일 단계용 부트클래스패스 최우선 설정 강제 바인딩
allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).configureEach {
            options.bootstrapClasspath = files("${projectDir}/libs/ImsMediaFramework.jar") + (options.bootstrapClasspath ?: files())
        }
    }
}
