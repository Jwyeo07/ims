plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def platformApiJar = providers.gradleProperty('platformApiJar').orNull

android {
    compileSdk 33
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "me.phh.ims"
        minSdk 32
        targetSdk 33
        versionCode 33
        versionName "1.0"
    }

    // 🌟 [추가] 순정 SDK보다 libs의 framework jar가 먼저 참조되도록 우선순위 변경
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).configureEach {
            options.bootstrapClasspath = files("${projectDir}/libs/ImsMediaFramework.jar") + options.bootstrapClasspath
        }
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions.classpath.from(files("${projectDir}/libs/ImsMediaFramework.jar"))
        }
    }

    sourceSets {
        main {
            jniLibs {
                srcDirs += "${projectDir}/jniLibs"
            }
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    externalNativeBuild {
        cmake {
            path file('jni/CMakeLists.txt')
        }
    }
    namespace 'me.phh.ims'
}

dependencies {
    if (platformApiJar != null) {
        compileOnly files(platformApiJar, 'libs/ImsMediaFramework.jar')
    } else {
        // 이 부분에서 컴파일 경로에 파일들이 들어가지만 순정 SDK에 순위가 밀리는 현상을 위 🌟 추가 코드로 해결합니다.
        compileOnly fileTree(dir: 'libs', include: '*.jar')
    }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}
