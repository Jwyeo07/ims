plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def platformApiJar = providers.gradleProperty('platformApiJar').orNull

android {
    compileSdk 33
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "me.phh.ims"
        minSdk 32
        targetSdk 33
        versionCode 33
        versionName "1.0"
    }

    sourceSets {
        main {
            jniLibs {
                srcDirs += "${projectDir}/jniLibs"
            }
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    externalNativeBuild {
        cmake {
            path file('jni/CMakeLists.txt')
        }
    }
    namespace 'me.phh.ims'
}

dependencies {
    if (platformApiJar != null) {
        compileOnly files(platformApiJar, 'libs/ImsMediaFramework.jar')
    } else {
        compileOnly fileTree(dir: 'libs', include: '*.jar')
    }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}

// 🌟 [최종 해결 플러그인] Android SDK 순정 Jar보다 내부 프레임워크 순위를 높여 코틀린 컴파일 문제를 해결합니다.
afterEvaluate {
    def customJar = files("${projectDir}/libs/ImsMediaFramework.jar")
    
    // 1. 자바 컴파일러 가로채기
    tasks.withType(JavaCompile).configureEach {
        options.bootstrapClasspath = customJar + (options.bootstrapClasspath ?: files())
    }
    
    // 2. 코틀린 컴파일러 빌드 환경(Classpath) 강제 우회 가로채기
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
        // 최신 코틀린 플러그인의 컴파일 환경 배열 맨 앞에 강제 배치
        task.setClasspath(customJar + task.getClasspath())
    }
}
